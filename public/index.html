<!DOCTYPE html>

    <meta name="theme-color" content="#ffffff" />

    <!--
      NOTE: The title/description below are the STATIC fallback served on the first
      byte, before React hydrates. Crawlers that do not execute JavaScript (notably
      Yandex, which handles a large share of Russian-language search in Uzbekistan)
      see only what is in this file. App.js overwrites these per-language at runtime
      via the #meta-* ids below.

      This is a stopgap. The permanent fix is per-route pre-rendered HTML — until
      then every route serves these same Uzbek homepage tags.
    -->
    <title>Vero Ceilings — Toshkentda osma shift ishlab chiqaruvchisi | Производитель подвесных потолков</title>

      id="meta-description"

    />

      id="meta-keywords"
      name="keywords"
      content="grilyato shift, armstrong shift, reykali shift, osma shift, shift panellari, shift narxi Toshkent, osma shift O'zbekiston"
    />

    />

    <link rel="canonical" href="https://veroceilings.uz/uz/" />

    <!-- Static hreflang fallback for the homepage. RouteMeta.js replaces these
         with the correct set for every other route once React hydrates; see
         its data-hreflang marker. -->

    <link rel="alternate" hreflang="ru" href="https://veroceilings.uz/ru/" data-hreflang="true" />
    <link rel="alternate" hreflang="en" href="https://veroceilings.uz/en/" data-hreflang="true" />
    <link rel="alternate" hreflang="x-default" href="https://veroceilings.uz/uz/" data-hreflang="true" />

    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />

    <meta
      id="meta-twitter-description"
      name="twitter:description"
      content="Toshkent va butun O'zbekiston bo'ylab grilyato, armstrong va reykali osma shiftlar."

    <link rel="mask-icon" href="%PUBLIC_URL%/safari-pinned-tab.svg" color="#000000" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Third-party CSS is render-blocking; warm the connection early. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
