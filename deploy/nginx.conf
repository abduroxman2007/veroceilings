# =============================================================================
# nginx configuration for veroceilings.uz — prerendered build (real per-route,
# per-locale static HTML from scripts/prerender.js).
#
# This supersedes deploy/nginx.conf.example (from the earlier soft-fixes
# pass). That version served one shared app shell for an explicit allow-list
# of known routes, with a comment noting exactly this: "This duplication
# disappears the moment the site moves to pre-rendered per-route HTML." That
# moment is now — every real route is its own file on disk
# (build/uz/products/grilyato/index.html, etc.), so there's no route list to
# keep in sync by hand, and unknown paths 404 by simple absence rather than
# an explicit denylist.
#
# Carried forward from that file: the HTTPS/www canonicalization, security
# headers, and crawler-file handling below — all still correct and worth
# keeping regardless of the rendering approach.
#
# NOTE ON DOCKER: this assumes certs are available to whichever container
# serves this config (e.g. mounted from certbot on the host, or a sidecar).
# You mentioned the actual VPS setup uses Docker and needs double-checking —
# once you share the real Dockerfile/compose, I'll adapt the paths below
# (root, ssl_certificate, the ACME challenge location) to match exactly
# rather than you having to reconcile it by hand.
# =============================================================================

# --- http -> https, both hosts ------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name veroceilings.uz www.veroceilings.uz;

    # Leave ACME challenges reachable over plain http for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://veroceilings.uz$request_uri;
    }
}

# --- www -> apex --------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.veroceilings.uz;

    ssl_certificate     /etc/letsencrypt/live/veroceilings.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veroceilings.uz/privkey.pem;

    return 301 https://veroceilings.uz$request_uri;
}

# --- canonical host -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name veroceilings.uz;

    ssl_certificate     /etc/letsencrypt/live/veroceilings.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veroceilings.uz/privkey.pem;

    root /usr/share/nginx/html;   # wherever build/ is copied/mounted
    index index.html;

    # --- Canonical root redirect ------------------------------------------
    # "/" itself is not a page; /uz is. A real 301 (not a client-side JS
    # redirect) means crawlers never index the bare domain as a thin
    # separate page from /uz.
    location = / {
        return 301 /uz;
    }

    # --- Legacy bare paths (pre-locale-routing URLs) ------------------------
    # /products, /products/grilyato, /about, etc. existed before locale-
    # prefixed routing shipped. 301 them to their /uz equivalent so any
    # existing links or index entries consolidate onto the new canonical
    # URLs instead of creating duplicate-content pages.
    location ~ ^/(products|projects|about|contact|faq|architects)(/.*)?$ {
        return 301 /uz$request_uri;
    }

    # ---- compression ----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- caching ----------------------------------------------------------
    # CRA fingerprints everything under /static/, so it's safe to cache forever.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images/fonts served from the build root but not fingerprinted.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- crawler / verification files --------------------------------------
    location = /robots.txt      { try_files $uri =404; access_log off; }
    location = /sitemap.xml     { try_files $uri =404; }
    location = /manifest.json   { try_files $uri =404; }
    location = /catalog.pdf     { try_files $uri =404; }
    location = /og-image.jpg    { try_files $uri =404; }
    location = /googlee4f800ba18ad58cf.html { try_files $uri =404; }

    # ---- everything else: real files only, real 404s -----------------------
    # $uri/index.html handles the prerendered directory-per-route structure
    # (/uz/products/grilyato -> build/uz/products/grilyato/index.html)
    # WITHOUT nginx's automatic directory->trailing-slash redirect, which
    # would otherwise silently turn every canonical URL into one with a
    # trailing slash and contradict what RouteMeta.js and sitemap.xml both
    # declare. $uri.html and bare $uri cover any flat files.
    location / {
        try_files $uri/index.html $uri.html $uri =404;

        # Prerendered HTML should be revalidated, not cached hard — it
        # changes whenever content/prices/products change.
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ---- security headers ---------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # A custom branded 404 page is a nice-to-have, not done here — this
    # serves nginx's default 404, which is correct for SEO (real 404 status)
    # even unstyled. To add one later, prerender NotFound.js to build/404.html
    # the same way scripts/prerender.js does every other route, then:
    #   error_page 404 =404 /404.html;
}
