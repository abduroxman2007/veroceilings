# Apache vhost / .htaccess-equivalent config for veroceilings.uz, in case
# the VPS turns out to be running Apache rather than Nginx (per your note —
# worth confirming against the actual container/compose setup before using
# this). Functionally equivalent to deploy/nginx.conf; see that file's
# comments for the reasoning behind each rule, especially the "real files
# only, real 404s" architecture note.
#
# Requires mod_rewrite and mod_headers enabled:
#   a2enmod rewrite headers expires

<VirtualHost *:80>
    ServerName veroceilings.uz
    ServerAlias www.veroceilings.uz
    DocumentRoot /usr/share/nginx/html   # adjust to wherever build/ lives

    <Directory /usr/share/nginx/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted

        RewriteEngine On

        # --- Canonical root redirect -------------------------------------
        RewriteCond %{REQUEST_URI} ^/$
        RewriteRule ^$ /uz [R=301,L]

        # --- Legacy bare paths (pre-locale-routing URLs) ------------------
        RewriteCond %{REQUEST_URI} ^/(products|projects|about|contact|faq|architects)(/.*)?$
        RewriteRule ^(products|projects|about|contact|faq|architects)(/.*)?$ /uz/$1$2 [R=301,L]

        # --- Serve build/<locale>/<route>/index.html for clean URLs -------
        # Mirrors nginx's `try_files $uri/index.html $uri.html $uri =404`:
        # try the directory-per-route index file first (this is what makes
        # /uz/products/grilyato resolve to
        # build/uz/products/grilyato/index.html without Apache's own
        # directory-slash redirect kicking in and adding a trailing slash).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{DOCUMENT_ROOT}/%{REQUEST_URI}/index.html -f
        RewriteRule ^(.*)$ $1/index.html [L]

        # Real static files (JS/CSS/images/etc.) pass through as-is.
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # Anything left over is a genuine 404 — no SPA fallback, matching
        # the nginx config's deliberate departure from the usual
        # "serve index.html for everything" SPA pattern (see nginx.conf).
    </Directory>

    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.html$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/veroceilings-error.log
    CustomLog ${APACHE_LOG_DIR}/veroceilings-access.log combined
</VirtualHost>
